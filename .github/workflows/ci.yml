name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Byte-compile
        run: python -m compileall -q foldersize.py tests

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Lint and shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.6"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Bash syntax
        run: bash -n install.sh uninstall.sh scripts/*.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh uninstall.sh scripts/*.sh

  package:
    name: Package
    runs-on: ubuntu-24.04
    needs: [test, lint]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build release archive
        run: ./scripts/package.sh

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: nautilus-foldersize-release
          path: dist/*
          if-no-files-found: error
