[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-foldersize"
version = "0.1.0"
description = "Show selected folder sizes in Nautilus' floating bar and a list-view column"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "kodejeet" }]
keywords = ["nautilus", "gnome", "files", "folder-size", "nautilus-python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kodejeet/nautilus-foldersize"
Issues = "https://github.com/kodejeet/nautilus-foldersize/issues"
Changelog = "https://github.com/kodejeet/nautilus-foldersize/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["foldersize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "W"]
ignore = ["E501", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
